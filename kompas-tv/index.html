<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kompas TV - Player Terminal</title>
    <!-- Library untuk memutar format .m3u8 (HLS) di browser -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { 
            --bg-color: #050507; 
            --panel-bg: #0b0c10;
            --neon-cyan: #00f2fe; 
            --neon-pink: #ff0055;
            --text-main: #ffffff; 
            --text-muted: #6c7a89; 
            --border-glow: rgba(0, 242, 254, 0.2);
        }
        *, *::before, *::after { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Roboto, monospace, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
        }
        .player-header { 
            width: 100%; 
            max-width: 1000px; 
            margin-bottom: 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--border-glow); 
            padding-bottom: 15px; 
        }
        .title-display { 
            font-size: 16px; 
            font-weight: bold; 
            letter-spacing: 2px; 
            color: var(--neon-cyan); 
            text-transform: uppercase; 
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.4); 
        }
        .badge-live { 
            background: rgba(255, 0, 85, 0.1); 
            color: var(--neon-pink); 
            border: 1px solid var(--neon-pink); 
            padding: 6px 12px; 
            font-size: 11px; 
            font-weight: bold; 
            border-radius: 4px; 
            letter-spacing: 1px; 
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.3); 
        }
        .video-wrapper { 
            width: 100%; 
            max-width: 1000px; 
            background: #000; 
            border-radius: 12px; 
            overflow: hidden; 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            box-shadow: 0 0 50px rgba(0, 242, 254, 0.15); 
            position: relative; 
            aspect-ratio: 16 / 9; 
        }
        video { 
            width: 100%; 
            height: 100%; 
            display: block; 
            aspect-ratio: 16 / 9; 
        }

        /* Styling Jadwal TV */
        .schedule-section {
            width: 100%;
            max-width: 1000px;
            margin-top: 25px;
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        .schedule-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--neon-cyan);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .schedule-container {
            max-height: 280px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .schedule-container::-webkit-scrollbar { width: 4px; }
        .schedule-container::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
        .schedule-container::-webkit-scrollbar-thumb { background: var(--neon-cyan); border-radius: 4px; }

        .schedule-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 13px;
            transition: all 0.3s ease;
            border-radius: 4px;
        }
        .schedule-item:hover {
            background: rgba(0, 242, 254, 0.05);
        }
        .schedule-time {
            color: var(--neon-cyan);
            font-weight: bold;
            width: 90px;
            font-size: 12px;
            letter-spacing: 1px;
        }
        .schedule-program {
            flex-grow: 1;
            color: var(--text-main);
            font-weight: 500;
        }
        .schedule-item.live {
            background: rgba(255, 0, 85, 0.08);
            border: 1px solid rgba(255, 0, 85, 0.3);
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.1);
        }
        .schedule-item.live .schedule-program {
            color: #fff;
            font-weight: bold;
        }
        .badge-now {
            background: var(--neon-pink);
            color: #fff;
            font-size: 9px;
            font-weight: 800;
            padding: 3px 6px;
            border-radius: 3px;
            letter-spacing: 1px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        .status-msg {
            color: var(--text-muted);
            font-size: 12px;
            text-align: center;
            padding: 20px;
            letter-spacing: 1px;
        }

        .btn-back { 
            margin-top: 25px; 
            background: transparent; 
            color: var(--text-muted); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            padding: 12px 24px; 
            font-size: 12px; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            border-radius: 6px; 
            cursor: pointer; 
            transition: all 0.3s; 
            font-weight: 600;
            text-decoration: none; 
            display: inline-block;
        }
        .btn-back:hover { 
            color: var(--neon-cyan); 
            border-color: var(--neon-cyan); 
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2); 
        }
    </style>
</head>
<body>

    <div class="player-header">
        <div class="title-display">ONLINE // KOMPAS TV</div>
        <div class="badge-live">● LIVE FEED</div>
    </div>
    
    <div class="video-wrapper">
        <video id="video" controls autoplay></video>
    </div>

    <div class="schedule-section">
        <div class="schedule-title">
            <span>[#] BROADCAST SCHEDULE</span>
        </div>
        <div id="schedule-container" class="schedule-container">
            <div class="status-msg">CONNECTING TO WORKER...</div>
        </div>
    </div>

    <!-- Kembali ke root utama folder home -->
    <a href="../" class="btn-back">✕ DISCONNECT TERMINAL</a>

    <script>
        // --- KONFIGURASI ---
        const STREAM_URL = 'https://op-flashcon-digdayahd-1.dens.tv/s/s104/index.m3u8?app_type=web&userid=lite&chname=Kompas_TV';
        const WORKER_URL = 'https://schedule.daviesdavid528.workers.dev/'; 
        const TARGET_CHANNEL_URL = 'https://www.jadwaltv.net/channel/kompastv'; 

        const video = document.getElementById('video');

        // Inisialisasi HLS Player
        function initPlayer() {
            if (Hls.isSupported()) {
                const hls = new Hls({
                    enableWorker: false,
                    debug: false
                });
                hls.loadSource(STREAM_URL);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(err => console.log('Autoplay ditangguhkan browser:', err));
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = STREAM_URL;
                video.play().catch(err => console.log('Autoplay ditangguhkan browser:', err));
            }
        }

        // Fetch Jadwal dari Cloudflare Worker
        async function fetchSchedule() {
            const container = document.getElementById('schedule-container');
            
            try {
                const endpoint = `${WORKER_URL}?url=${encodeURIComponent(TARGET_CHANNEL_URL)}&_=${Date.now()}`;
                
                const res = await fetch(endpoint);
                if (!res.ok) throw new Error('Worker response failed');
                
                const result = await res.json();
                if (!result.success || !result.data || result.data.length === 0) {
                    container.innerHTML = `<div class="status-msg">NO SCHEDULE DATA AVAILABLE</div>`;
                    return;
                }

                container.innerHTML = '';
                let activeRow = null;

                result.data.forEach(item => {
                    const row = document.createElement('div');
                    row.className = `schedule-item ${item.isLive ? 'live' : ''}`;
                    row.innerHTML = `
                        <span class="schedule-time">${item.time} WIB</span>
                        <span class="schedule-program">${item.title}</span>
                        ${item.isLive ? '<span class="badge-now">ON AIR</span>' : ''}
                    `;

                    container.appendChild(row);

                    if (item.isLive) {
                        activeRow = row;
                    }
                });

                // Auto-scroll ke acara yang sedang ON AIR
                if (activeRow) {
                    activeRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }

            } catch (err) {
                console.error(err);
                container.innerHTML = `<div class="status-msg">FAILED TO CONNECT TO SCHEDULE WORKER</div>`;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initPlayer();
            fetchSchedule();
            
            // Re-fetch tiap 15 detik agar status ON AIR berpindah tepat waktu
            setInterval(fetchSchedule, 15000);
        });
    </script>
</body>
</html>
